// Build state keys
const ST = {};
DAYS.forEach(day => {
  if (day.type === 'study') {
    ST[`${day.d}-estudo`] = false;
    [1,3,7,14,30].forEach(r => { ST[`${day.d}-r${r}`] = false; });
  } else if (day.type === 'sim') {
    ST[`${day.d}-realizar`] = false;
    ST[`${day.d}-gabarito`] = false;
  } else {
    ST[`${day.d}-ok`] = false;
  }
});

try {
  const s = localStorage.getItem('oab47_115');
  if (s) Object.assign(ST, JSON.parse(s));
} catch(e) {}

function save() {
  try { localStorage.setItem('oab47_115', JSON.stringify(ST)); } catch(e) {}
}

function updateProgress() {
  const total = Object.keys(ST).length;
  const done = Object.values(ST).filter(Boolean).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('pl').textContent = `${done} / ${total} concluídos (${pct}%)`;
}

let curW = 0;
function setWeek(w, el) {
  curW = w;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  render();
}

function buildCtrls() {
  const c = document.getElementById('ctrls');
  const b0 = document.createElement('button');
  b0.className = 'fbtn on'; b0.textContent = 'Todas as semanas';
  b0.onclick = () => setWeek(0, b0); c.appendChild(b0);
  const weeks = [...new Set(DAYS.map(d => d.w))];
  weeks.forEach(w => {
    const b = document.createElement('button');
    b.className = 'fbtn'; b.textContent = `Semana ${w}`;
    b.onclick = () => setWeek(w, b); c.appendChild(b);
  });
}

function makeItem(key, label, color) {
  const li = document.createElement('li');
  li.className = 'item';
  li.setAttribute('data-key', key);
  li.innerHTML = `<div class="cb${ST[key] ? ' chk' : ''}"></div><span class="${color ? 'rev-itxt' : 'itxt'}" ${color ? `style="color:${color};font-weight:600"` : ''}>${label}</span>`;
  li.addEventListener('click', function() {
    const k = this.getAttribute('data-key');
    ST[k] = !ST[k];
    this.querySelector('.cb').classList.toggle('chk', ST[k]);
    save(); updateProgress();
    // check if parent card fully done
    const card = this.closest('.dcard');
    const keys = [...card.querySelectorAll('[data-key]')].map(el => el.getAttribute('data-key'));
    card.classList.toggle('done', keys.every(k => ST[k]));
  });
  return li;
}

  const weeks = [...new Set(DAYS.map(d => d.w))];
  const wc = document.getElementById('wc'); wc.innerHTML = '';
  weeks.forEach(w => {
    if (curW !== 0 && curW !== w) return;
    const days = DAYS.filter(d => d.w === w);
    const wb = document.createElement('div'); wb.className = 'wblk';
    wb.innerHTML = `<div class="wtitle">Semana ${w} &mdash; ${dayDate(days[0].d)} a ${dayDate(days[days.length-1].d)}</div>`;
    const grid = document.createElement('div'); grid.className = 'dgrid';

    days.forEach(day => {
      const card = document.createElement('div'); card.className = 'dcard';

      const dhead = `<div class="dhead"><span class="dnum">Dia ${day.d}</span><span class="ddate">${dayDate(day.d)}</span></div>`;

      if (day.type === 'study') {
        const allKeys = [`${day.d}-estudo`, ...[1,3,7,14,30].map(r => `${day.d}-r${r}`)];
        if (allKeys.every(k => ST[k])) card.classList.add('done');

        card.innerHTML = dhead + `<div class="dsubj">${day.mat}</div><div class="sec-lbl">Conteúdo</div><ul class="items" id="items-${day.d}"></ul><div class="divider"></div><div class="sec-lbl">Revisões programadas</div><ul class="items" id="revs-${day.d}"></ul>`;

        const itemsList = card.querySelector(`#items-${day.d}`);
        day.topics.forEach(t => itemsList.appendChild(makeItem(`${day.d}-estudo`, t, null)));

        const revsList = card.querySelector(`#revs-${day.d}`);
        [1,3,7,14,30].forEach(r => {
          const li = makeItem(`${day.d}-r${r}`, `${REV_LABELS[r]} — ${addDays(day.d, r)}`, REV_COLORS[r]);
          revsList.appendChild(li);
        });

      } else if (day.type === 'sim') {
        const keys = [`${day.d}-realizar`, `${day.d}-gabarito`];
        if (keys.every(k => ST[k])) card.classList.add('done');
        card.innerHTML = dhead + `<span class="tag-sim">🎯 Simulado</span><div class="dsubj">${day.mat}</div><ul class="items" id="sim-${day.d}"></ul>`;
        const ul = card.querySelector(`#sim-${day.d}`);
        ul.appendChild(makeItem(`${day.d}-realizar`, 'Realizar o simulado', null));
        ul.appendChild(makeItem(`${day.d}-gabarito`, 'Revisar gabarito e pontos fracos', null));

      } else if (day.type === 'prova') {
        card.innerHTML = dhead + `<span class="tag-prova">🏆 Prova</span><div class="dsubj">${day.mat}</div>`;
        card.style.borderColor = '#7F77DD';

      } else {
        const tagClass = day.type === 'noc' ? 'tag-noc' : 'tag-rev';
        const tagLabel = day.type === 'noc' ? '🔥 Nocaute' : '📋 Revisão';
        if (ST[`${day.d}-ok`]) card.classList.add('done');
        card.innerHTML = dhead + `<span class="${tagClass}">${tagLabel}</span><div class="dsubj">${day.mat}</div><ul class="items" id="rl-${day.d}"></ul>`;
        const ul = card.querySelector(`#rl-${day.d}`);
        ul.appendChild(makeItem(`${day.d}-ok`, 'Concluído', null));
      }

      grid.appendChild(card);
    });

    wb.appendChild(grid); wc.appendChild(wb);
  });
}

buildCtrls(); render(); updateProgress();
</script>
</body>
</html>
